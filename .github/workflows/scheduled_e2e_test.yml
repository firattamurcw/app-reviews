name: Scheduled E2E Test

on:
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run review E2E tests
        id: e2e_reviews
        continue-on-error: true
        run: |
          set +e
          uv run python -m pytest tests/app_reviews/e2e/test_live.py -m live -v -s --tb=long 2>&1 | tee e2e_reviews_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Run search E2E tests
        id: e2e_search
        continue-on-error: true
        run: |
          set +e
          uv run python -m pytest tests/app_reviews/e2e/test_search_live.py -m live -v -s --tb=long 2>&1 | tee e2e_search_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Report failure
        if: steps.e2e_reviews.outputs.exit_code != '0' || steps.e2e_search.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/scheduled_e2e_test.yml
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEWS_EXIT: ${{ steps.e2e_reviews.outputs.exit_code }}
          SEARCH_EXIT: ${{ steps.e2e_search.outputs.exit_code }}
        run: |
          set -euo pipefail

          REVIEWS_STATUS="passed"
          SEARCH_STATUS="passed"
          [ "$REVIEWS_EXIT" = "0" ] || REVIEWS_STATUS="failed"
          [ "$SEARCH_EXIT" = "0" ] || SEARCH_STATUS="failed"

          # Defensive: if a suite died before tee created its log, still report.
          REVIEWS_OUTPUT=$(tail -40 e2e_reviews_output.txt 2>/dev/null || echo "(no output captured)")
          SEARCH_OUTPUT=$(tail -40 e2e_search_output.txt 2>/dev/null || echo "(no output captured)")

          cat > issue_body.md << ENDOFBODY
          ## Scheduled E2E Test Failed

          **Run:** ${RUN_URL}
          **Branch:** \`${REF_NAME}\`
          **Triggered by:** \`${EVENT_NAME}\`
          **Detected:** $(date -u +'%Y-%m-%d %H:%M UTC')

          | Suite | Status |
          |-------|--------|
          | Reviews | ${REVIEWS_STATUS} |
          | Search | ${SEARCH_STATUS} |

          ### Reviews Test Output

          \`\`\`
          ${REVIEWS_OUTPUT}
          \`\`\`

          ### Search Test Output

          \`\`\`
          ${SEARCH_OUTPUT}
          \`\`\`

          > Auto-reported by the [Scheduled E2E Test](${WORKFLOW_URL}) workflow.
          ENDOFBODY

          # Reuse the open report if one exists, so a store-side outage that
          # persists for days does not open one issue per day.
          EXISTING=$(gh issue list --state open --label e2e --json number,title \
            | jq -r '[.[] | select(.title | startswith("E2E Test Failure"))] | .[0].number // empty')

          if [[ "$EXISTING" =~ ^[0-9]+$ ]]; then
            echo "Commenting on existing report #${EXISTING}"
            gh issue comment "$EXISTING" --body-file issue_body.md
          else
            echo "Opening a new report"
            gh issue create \
              --title "E2E Test Failure - $(date -u +'%Y-%m-%d %H:%M UTC')" \
              --body-file issue_body.md \
              --label "bug,e2e"
          fi

      - name: Fail the workflow
        if: steps.e2e_reviews.outputs.exit_code != '0' || steps.e2e_search.outputs.exit_code != '0'
        run: exit 1
